<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="amk-code" content="__CODE__">
<title>Memverifikasi...</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#07110f;color:#edf6f2;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.card{max-width:320px;width:100%;background:#0d1916;border:1px solid rgba(188,216,207,.08);border-radius:14px;padding:28px 22px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 28px rgba(0,0,0,.45)}
.spin{width:40px;height:40px;border:2px solid rgba(188,216,207,.10);border-top-color:#53d6b2;border-radius:50%;animation:r .9s linear infinite;margin:0 auto 16px;box-shadow:0 0 18px rgba(83,214,178,.18)}
@keyframes r{to{transform:rotate(360deg)}}
h1{margin:0 0 4px;font-size:14px;font-weight:600;color:#edf6f2;letter-spacing:.2px}
p{margin:0;color:#6d8c82;font-size:12px}
.err{color:#ff8484;font-size:12px;margin-top:14px;display:none}
.refresh{margin-top:18px;background:transparent;border:1px solid rgba(83,214,178,.35);color:#53d6b2;padding:9px 18px;border-radius:8px;font:inherit;font-size:12px;font-weight:600;letter-spacing:.3px;cursor:pointer}
.brand{margin-top:18px;font-size:11px;color:#6d8c82;letter-spacing:.4px}.brand b{color:#acc5bc;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="spin" id="spin" aria-hidden="true"></div>
    <h1>Memverifikasi browser</h1>
    <p>Mohon tunggu sebentar.</p>
    <div class="err" id="err" role="alert"></div>
    <button type="button" id="amrk-refresh" class="refresh">Tap untuk lanjut &rsaquo;</button>
    <noscript>JavaScript wajib aktif untuk melanjutkan.</noscript>
  </div>
  <div class="brand">Protected by 🐺 <b>AMAROK</b></div>
</div>
<script src="/jembot.js"></script>
</body>
</html>
